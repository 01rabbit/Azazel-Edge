# Edge#471 stage 2: the AI agent's directories that the Web UI reads.
# Owner azazel-agent, group azazel-web, setgid so what the agent writes (umask
# 0027) is readable by the Web UI and by nobody else; only the agent writes.
# Installed as /etc/tmpfiles.d/azazel-edge-agent.conf.
d /run/azazel-edge-agent        2750 azazel-agent azazel-web -
d /run/azazel-edge-agent-query  2750 azazel-agent azazel-web -
d /var/log/azazel-edge/ai       2750 azazel-agent azazel-web -
