services:
  mattermost-db:
    image: postgres:16-alpine
    container_name: azazel-edge-mm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mattermost
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mm-password-change
    volumes:
      - mattermost_db:/var/lib/postgresql/data
    networks:
      - mattermost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    container_name: azazel-edge-mattermost
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      mattermost-db:
        condition: service_healthy
    ports:
      - "8065:8065"
    environment:
      TZ: Asia/Tokyo
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mm-password-change@mattermost-db:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: ${MATTERMOST_SITE_URL:-http://172.16.0.254:8065}
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: ${MATTERMOST_ALLOWED_UNTRUSTED_INTERNAL_CONNECTIONS:-172.16.0.254}
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
    volumes:
      - mattermost_config:/mattermost/config
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
      - mattermost_plugins:/mattermost/plugins
      - mattermost_client_plugins:/mattermost/client/plugins
    healthcheck:
      test: ["CMD", "/mattermost/bin/mattermost", "-c", "/mattermost/config/config.json", "db", "version"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - mattermost

volumes:
  mattermost_db:
  mattermost_config:
  mattermost_data:
  mattermost_logs:
  mattermost_plugins:
  mattermost_client_plugins:

# Mattermost's own bridge network with a fixed subnet (Edge#477). Its slash
# commands call back to http://172.16.0.254/api/mattermost/command from this
# network, and nginx (installer/internal/install_https_proxy.sh,
# MATTERMOST_BRIDGE_SUBNET) admits that callback from this subnet only.
# 172.31.250.0/24: outside the internal LAN (172.16.0.0/24), at the far end
# of Docker's default pools (172.17-172.31, handed out from the low end), and
# rarely used by venue or office networks (mostly 192.168/16 and 10/8).
# A separate network rather than the project's default one: the Ollama
# compose file in the same directory shares that default network.
# Existing devices: `docker compose -f docker-compose.mattermost.yml up -d`
# recreates both containers on this network (data volumes are kept).
networks:
  mattermost:
    ipam:
      config:
        - subnet: 172.31.250.0/24
