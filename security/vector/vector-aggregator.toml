# Azazel-Edge Vector configuration - aggregator mode
# Receives log lines from multiple nodes and archives locally.
# Listens on the address install_vector.sh writes to
# /etc/default/azazel-edge-vector (VECTOR_AGGREGATOR_ADDRESS; default the
# internal LAN address on br0, port 5514), never on every address (Edge#477):
# the uplink (WAN) side does not get to write into the archive.

[sources.edge_udp]
type = "socket"
mode = "udp"
address = "${VECTOR_AGGREGATOR_ADDRESS}"

[transforms.tag_node]
type = "remap"
inputs = ["edge_udp"]
source = '''
  .ingest = "azazel-aggregator"
'''

[sinks.aggregate_archive]
type = "file"
inputs = ["tag_node"]
path = "/var/log/azazel-edge/vector/aggregate-%Y-%m-%d.jsonl"
encoding.codec = "json"
