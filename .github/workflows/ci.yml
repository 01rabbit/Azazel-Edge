name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-python:
    name: Python static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python sources
        run: |
          python -m compileall -q py azazel_edge_web

  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -U pip wheel setuptools
          pip install -r requirements/runtime.txt
          # Fabric remains optional at runtime, but CI installs the exact pin so
          # AZ-06 shadow/replay contract integration is exercised on every change.
          pip install -r requirements/fabric.txt
          pip install pytest

      - name: Normalize local tooling permissions
        run: |
          find bin -maxdepth 1 -type f -exec chmod +x {} +

      - name: Run tests
        run: |
          . .venv/bin/activate
          PYTHONPATH=.:py pytest -q

  test-rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Rust tests
        run: |
          cd rust/azazel-edge-core
          cargo test

  service-objectives:
    # Program plan §8 rows owned by Edge (Edge#414): SO-03, SO-04, SO-07
    # (process-kill). SO-02 needs a lab and runs in service-objectives-lab,
    # not here. One JSON record per objective is uploaded as an artifact
    # whatever the outcome. SO-03 drives the release core built below into
    # the AI agent service (its default --core-bin is that build). SO-03 and
    # SO-07 run unprivileged; SO-04 runs as
    # root because its completion half installs owned tc/nft state on dummy
    # interfaces (unprivileged it takes no samples and would be red).
    #
    # Exit semantics (--ci; verdicts are never changed, Edge#414 "a skipped
    # harness must not go green"):
    #   harness did not execute (skipped, crashed, root missing) -> red
    #   invalid record, or a requested objective without one   -> red
    #   run-health prerequisite unmet (CI_DECLARED_PREREQUISITES) -> red
    #   verdict fail                                            -> red
    #   not_measurable with a violation or unfinished sample    -> red
    #   not_measurable, executed, valid, every part holds, only
    #     declared gaps block it                                -> green, with
    #     the verdict table (samples, max, gaps) in the step summary
    #   verdict pass, executed and valid                        -> green
    # A green not_measurable is a clean measurement blocked only by gaps
    # declared in OBJECTIVE_SPECS; it is never a pass and never gate evidence.
    # Nothing here enables enforcement.
    name: Service objectives (§8 SO-03/04/07)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iproute2
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -U pip wheel setuptools
          pip install -r requirements/runtime.txt
          pip install -r requirements/fabric.txt
          pip install pytest

      - name: Build the Rust core measured by SO-03 and SO-04
        run: |
          cd rust/azazel-edge-core
          cargo build --release

      - name: Real-core test of the SO-04 hostile-load driver
        # The test-python job has no core build, so the test is skipped there;
        # here it must run and pass, never skip.
        run: |
          . .venv/bin/activate
          PYTHONPATH=.:py python -m pytest -q -rs -p no:cacheprovider \
            tests/test_service_objectives_so04_hostile_load_v1.py -k real_core | tee real-core.log
          grep -Eq "^1 passed" real-core.log

      - name: Real-nft test of the core's owned isolate/redirect leases (root)
        # Edge#464. Treated like SO-04: root, inside a network namespace the
        # test creates, against the release core built above with enforcement
        # on and dry run off in that namespace only. The test-python job is not
        # root, so it is skipped there; here it must run and pass, never skip.
        run: |
          sudo env "PATH=$PATH" PYTHONPATH=.:py .venv/bin/python -m pytest -q -rs -p no:cacheprovider \
            tests/test_core_nft_owned_lease_v1.py | tee real-nft.log
          grep -Eq "^1 passed" real-nft.log

      - name: Web UI non-root peer checks with real uids (root, Edge#471)
        # control.sock's per-uid table and the agent's manual_query socket,
        # with probes that switch to other uids. Skipped as non-root in the
        # test-python job; here it must run and pass, never skip.
        run: |
          sudo env "PATH=$PATH" PYTHONPATH=.:py .venv/bin/python -m pytest -q -rs -p no:cacheprovider \
            tests/test_web_non_root_stage1_linux_root_v1.py | tee web-non-root.log
          grep -Eq "^[0-9]+ passed" web-non-root.log
          ! grep -Eq "skipped|failed|error" web-non-root.log

      - name: Run SO-03 and SO-07 harnesses
        run: |
          . .venv/bin/activate
          PYTHONPATH=.:py python -m azazel_edge.service_objectives run --ci \
            --objective SO-03,SO-07 \
            --out-dir service-objective-records

      - name: Run SO-04 harness (root)
        if: success() || failure()
        run: |
          sudo env "PATH=$PATH" PYTHONPATH=.:py .venv/bin/python -m azazel_edge.service_objectives run --ci \
            --objective SO-04 \
            --core-bin rust/azazel-edge-core/target/release/azazel-edge-core \
            --out-dir service-objective-records

      - name: Re-validate records
        if: always()
        run: |
          . .venv/bin/activate
          sudo chown -R "$(id -u)" service-objective-records || true
          PYTHONPATH=.:py python -m azazel_edge.service_objectives validate --ci --objective SO-03,SO-04,SO-07 \
            --expect-commit "$GITHUB_SHA" \
            service-objective-records

      - name: Check SO-04 ran under the declared hostile load
        # In addition to validate --ci (unchanged): both SO-04 parts must show
        # the declared hostile-load profile applied, by the validator's own
        # recomputation, and keep no gap but the declared provisional ones.
        if: always()
        run: |
          . .venv/bin/activate
          PYTHONPATH=.:py python -m azazel_edge.service_objectives.so04_hostile_load service-objective-records

      - name: Upload records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-objective-records
          path: service-objective-records/*.json
          if-no-files-found: error

  service-objectives-lab:
    # SO-02 (virtual-lab, Edge#414): Edge's control daemon, web UI and Suricata
    # in network namespaces the harness creates, as root. The harness refuses
    # while another Suricata runs, so the packaged unit is stopped first. A
    # virtual-lab record is never hardware evidence and never gates the
    # physical-NIC variant (R7).
    #
    # Cost: about 25-30 runner minutes per run, so it runs only on pushes to
    # main and on workflow_dispatch, not on every branch or pull request. On a
    # pull request this job shows as skipped (the job did not run; it is not a
    # harness result). Same --ci exit semantics as service-objectives: a lab
    # that did not take its 20 samples is red, and so is one whose samples
    # break the 10 s bound even though its three declared SO02-* gaps keep the
    # verdict not_measurable. Green only for a clean, gap-blocked measurement.
    name: Service objectives lab (§8 SO-02)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends suricata iputils-ping
          sudo systemctl stop suricata.service || true
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -U pip wheel setuptools
          pip install -r requirements/runtime.txt
          pip install -r requirements/fabric.txt

      - name: Run SO-02 lab harness
        run: |
          sudo env "PATH=$PATH" PYTHONPATH=.:py .venv/bin/python -m azazel_edge.service_objectives run --ci \
            --objective SO-02 \
            --out-dir service-objective-lab-records

      - name: Re-validate lab records
        if: always()
        run: |
          . .venv/bin/activate
          sudo chown -R "$(id -u)" service-objective-lab-records || true
          PYTHONPATH=.:py python -m azazel_edge.service_objectives validate --ci --objective SO-02 \
            --expect-commit "$GITHUB_SHA" \
            service-objective-lab-records

      - name: Upload lab records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-objective-lab-records
          path: service-objective-lab-records/*.json
          if-no-files-found: error

  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  supply-chain-baseline:
    name: SBOM + dependency scan baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install supply-chain tools
        run: |
          python -m pip install -U pip
          pip install cyclonedx-bom pip-audit

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          cyclonedx-py requirements requirements/runtime.txt --output-file sbom-runtime.cdx.json

      - name: Run dependency vulnerability scan (baseline)
        continue-on-error: true
        run: |
          pip-audit -r requirements/runtime.txt -f json -o pip-audit-runtime.json

      - name: Upload supply-chain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-baseline
          path: |
            sbom-runtime.cdx.json
            pip-audit-runtime.json

      - name: Generate SHA-256 checksums for key artifacts
        run: |
          sha256sum installer/internal/install_all.sh > release-checksums.sha256
          sha256sum installer/internal/install_migrated_tools.sh >> release-checksums.sha256
          sha256sum installer/internal/install_ai_runtime.sh >> release-checksums.sha256
          sha256sum sbom-runtime.cdx.json >> release-checksums.sha256
          sha256sum pip-audit-runtime.json >> release-checksums.sha256

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: release-checksums.sha256
