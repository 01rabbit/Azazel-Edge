name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-python:
    name: Python static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python sources
        run: |
          python -m compileall -q py azazel_edge_web

  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -U pip wheel setuptools
          pip install -r requirements/runtime.txt
          # Fabric remains optional at runtime, but CI installs the exact pin so
          # AZ-06 shadow/replay contract integration is exercised on every change.
          pip install -r requirements/fabric.txt
          pip install pytest

      - name: Normalize local tooling permissions
        run: |
          find bin -maxdepth 1 -type f -exec chmod +x {} +

      # The touch console's and SENTINEL console's JS logic tests need node;
      # without it the Python wrappers skip them, so run them here explicitly.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS logic tests (touch console, SENTINEL console)
        run: |
          node tests/touch_console_logic.test.js
          node tests/sentinel_console_logic.test.js

      - name: Run tests
        run: |
          . .venv/bin/activate
          PYTHONPATH=.:py pytest -q

  test-rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Rust tests
        run: |
          cd rust/azazel-edge-core
          cargo test

  suricata-rules:
    # The packaged Suricata (Debian trixie, 7.0.x) must load every active rule
    # in security/suricata/azazel-lite.rules. A rule it rejects is dropped
    # silently at normal start-up, so `suricata -T` (rc=0) is the gate, and a
    # scapy-built pcap must make each active rule fire. A container run is
    # not evidence from the real device.
    name: Suricata rules (debian:trixie)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install Suricata and test tools
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends suricata python3-pytest python3-scapy
          suricata -V

      - name: suricata -T with a minimal yaml
        run: |
          home_net="$(sed -n 's/.*vars\.address-groups\.HOME_NET="\(\[[^]]*\]\)".*/\1/p' systemd/azazel-edge-suricata.service)"
          test -n "$home_net"
          printf '%%YAML 1.1\n---\nvars:\n  address-groups:\n    HOME_NET: "%s"\n    EXTERNAL_NET: "!$HOME_NET"\nclassification-file: /etc/suricata/classification.config\n' "$home_net" > /tmp/minimal.yaml
          mkdir -p /tmp/suricata-t
          suricata -T -c /tmp/minimal.yaml -S security/suricata/azazel-lite.rules -l /tmp/suricata-t

      - name: Rule contract and pcap replay
        # Here the Suricata half must run, never skip.
        run: |
          python3 -m pytest -q -rs -p no:cacheprovider tests/test_suricata_rules_v1.py | tee suricata-rules.log
          grep -Eq "^[0-9]+ passed" suricata-rules.log
          ! grep -Eq "skipped|failed|error" suricata-rules.log

  service-objectives:
    # Program plan §8 rows owned by Edge (Edge#414): SO-03, SO-04, SO-07
    # (process-kill). SO-02 needs a lab and runs in service-objectives-lab,
    # not here. One JSON record per objective is uploaded as an artifact
    # whatever the outcome. SO-03 drives the release core built below into
    # the AI agent service (its default --core-bin is that build). SO-03 and
    # SO-07 run unprivileged; SO-04 runs as
    # root because its completion half installs owned tc/nft state on dummy
    # interfaces (unprivileged it takes no samples and would be red).
    #
    # Exit semantics (--ci; verdicts are never changed, Edge#414 "a skipped
    # harness must not go green"):
    #   harness did not execute (skipped, crashed, root missing) -> red
    #   invalid record, or a requested objective without one   -> red
    #   run-health prerequisite unmet (CI_DECLARED_PREREQUISITES) -> red
    #   verdict fail                                            -> red
    #   not_measurable with a violation or unfinished sample    -> red
    #   not_measurable, executed, valid, every part holds, only
    #     declared gaps block it                                -> green, with
    #     the verdict table (samples, max, gaps) in the step summary
    #   verdict pass, executed and valid                        -> green
    # A green not_measurable is a clean measurement blocked only by gaps
    # declared in OBJECTIVE_SPECS; it is never a pass and never gate evidence.
    # Nothing here enables enforcement.
    name: Service objectives (§8 SO-03/04/07)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iproute2 conntrack iputils-ping
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -U pip wheel setuptools
          pip install -r requirements/runtime.txt
          pip install -r requirements/fabric.txt
          pip install pytest

      - name: Build the Rust core measured by SO-03 and SO-04
        run: |
          cd rust/azazel-edge-core
          cargo build --release

      - name: Real-core test of the SO-04 hostile-load driver
        # The test-python job has no core build, so the test is skipped there;
        # here it must run and pass, never skip.
        run: |
          . .venv/bin/activate
          PYTHONPATH=.:py python -m pytest -q -rs -p no:cacheprovider \
            tests/test_service_objectives_so04_hostile_load_v1.py -k real_core | tee real-core.log
          grep -Eq "^1 passed" real-core.log

      - name: Real-nft test of the core's owned isolate/redirect leases (root)
        # Edge#464. Treated like SO-04: root, inside a network namespace the
        # test creates, against the release core built above with enforcement
        # on and dry run off in that namespace only. The test-python job is not
        # root, so it is skipped there; here it must run and pass, never skip.
        run: |
          sudo env "PATH=$PATH" PYTHONPATH=.:py .venv/bin/python -m pytest -q -rs -p no:cacheprovider \
            tests/test_core_nft_owned_lease_v1.py | tee real-nft.log
          grep -Eq "^1 passed" real-nft.log

      - name: Real-network test of the flow-scoped temporary restriction (root)
        # docs/architecture/scoped-temporary-actions.md. Four network
        # namespaces with real TCP: only the attack flow is limited, the
        # management flow and the interface's own qdisc are untouched, release
        # at expiry, and a wedged nft (shadowed for the core only, in a
        # private mount namespace) never holds back a due release. Root, the
        # release core built above; skipped in test-python, here it must run
        # and pass, never skip. Runner timings, never hardware evidence.
        run: |
          sudo env "PATH=$PATH" PYTHONPATH=.:py .venv/bin/python -m pytest -q -rs -p no:cacheprovider \
            tests/test_core_scoped_actions_netns_v1.py | tee scoped-netns.log
          grep -Eq "^5 passed" scoped-netns.log
          ! grep -Eq "skipped|failed|error" scoped-netns.log

      - name: Web UI and AI agent non-root checks with real uids (root, Edge#471)
        # control.sock's per-uid table and the agent's manual_query socket,
        # with probes that switch to other uids. Skipped as non-root in the
        # test-python job; here it must run and pass, never skip.
        run: |
          # The stage 2 test runs the agent as an unprivileged uid, which must
          # be able to search the runner's home to exec .venv/bin/python (the
          # checkout itself is world-readable). Search only, on this runner.
          sudo chmod o+x "$HOME"
          sudo env "PATH=$PATH" PYTHONPATH=.:py .venv/bin/python -m pytest -q -rs -p no:cacheprovider \
            tests/test_web_non_root_stage1_linux_root_v1.py tests/test_agent_non_root_stage2_linux_root_v1.py | tee web-non-root.log
          grep -Eq "^[0-9]+ passed" web-non-root.log
          ! grep -Eq "skipped|failed|error" web-non-root.log

      - name: Run SO-03 and SO-07 harnesses
        run: |
          . .venv/bin/activate
          PYTHONPATH=.:py python -m azazel_edge.service_objectives run --ci \
            --objective SO-03,SO-07 \
            --out-dir service-objective-records

      - name: Run SO-04 harness (root)
        if: success() || failure()
        run: |
          sudo env "PATH=$PATH" PYTHONPATH=.:py .venv/bin/python -m azazel_edge.service_objectives run --ci \
            --objective SO-04 \
            --core-bin rust/azazel-edge-core/target/release/azazel-edge-core \
            --out-dir service-objective-records

      - name: Re-validate records
        if: always()
        run: |
          . .venv/bin/activate
          sudo chown -R "$(id -u)" service-objective-records || true
          PYTHONPATH=.:py python -m azazel_edge.service_objectives validate --ci --objective SO-03,SO-04,SO-07 \
            --expect-commit "$GITHUB_SHA" \
            service-objective-records

      - name: Check SO-04 ran under the declared hostile load
        # In addition to validate --ci (unchanged): both SO-04 parts must show
        # the declared hostile-load profile applied, by the validator's own
        # recomputation, and keep no gap but the declared provisional ones.
        if: always()
        run: |
          . .venv/bin/activate
          PYTHONPATH=.:py python -m azazel_edge.service_objectives.so04_hostile_load service-objective-records

      - name: Upload records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-objective-records
          path: service-objective-records/*.json
          if-no-files-found: error

  service-objectives-lab:
    # SO-02 (virtual-lab, Edge#414): Edge's control daemon, web UI and Suricata
    # in network namespaces the harness creates, as root. The harness refuses
    # while another Suricata runs, so the packaged unit is stopped first. A
    # virtual-lab record is never hardware evidence and never gates the
    # physical-NIC variant (R7).
    #
    # Cost: about 25-30 runner minutes per run, so it runs only on pushes to
    # main and on workflow_dispatch, not on every branch or pull request. On a
    # pull request this job shows as skipped (the job did not run; it is not a
    # harness result). Same --ci exit semantics as service-objectives: a lab
    # that did not take its 20 samples is red, and so is one whose samples
    # break the 10 s bound even though its three declared SO02-* gaps keep the
    # verdict not_measurable. Green only for a clean, gap-blocked measurement.
    name: Service objectives lab (§8 SO-02)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends suricata iputils-ping
          sudo systemctl stop suricata.service || true
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -U pip wheel setuptools
          pip install -r requirements/runtime.txt
          pip install -r requirements/fabric.txt

      - name: Run SO-02 lab harness
        run: |
          sudo env "PATH=$PATH" PYTHONPATH=.:py .venv/bin/python -m azazel_edge.service_objectives run --ci \
            --objective SO-02 \
            --out-dir service-objective-lab-records

      - name: Re-validate lab records
        if: always()
        run: |
          . .venv/bin/activate
          sudo chown -R "$(id -u)" service-objective-lab-records || true
          PYTHONPATH=.:py python -m azazel_edge.service_objectives validate --ci --objective SO-02 \
            --expect-commit "$GITHUB_SHA" \
            service-objective-lab-records

      - name: Upload lab records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-objective-lab-records
          path: service-objective-lab-records/*.json
          if-no-files-found: error

  service-objectives-so11:
    # SO-11 (virtual-lab, Edge#414): SO-03, the SO-04 start half and SO-07
    # re-run against the release core with non-alert EVE lines offered at 100%
    # and 120% of the declared ingress quota (OF-06). Unprivileged: no part
    # installs tc/nft state. The quota is provisional and container-derived,
    # so the verdict stays not_measurable (SO11-QUOTA-PROVISIONAL); a runner
    # record is never hardware evidence.
    #
    # Cost: six referenced runs, several runner minutes, so like
    # service-objectives-lab it runs only on pushes to main and on
    # workflow_dispatch; on a pull request it shows as skipped (not a harness
    # result). Same --ci exit semantics: a part that did not take its samples,
    # whose load was not offered as declared, that did not shed at 120%, or
    # that broke its row's bound is red; green only for a clean measurement
    # blocked by declared gaps. The checks count lines and compare against the
    # rows' own bounds, so a slower runner is red only if a bound really breaks.
    name: Service objectives SO-11 (§8 hostile load)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -U pip wheel setuptools
          pip install -r requirements/runtime.txt
          pip install -r requirements/fabric.txt

      - name: Build the Rust core
        run: |
          cd rust/azazel-edge-core
          cargo build --release

      - name: Run SO-11 harness
        run: |
          . .venv/bin/activate
          PYTHONPATH=.:py python -m azazel_edge.service_objectives run --ci \
            --objective SO-11 \
            --core-bin rust/azazel-edge-core/target/release/azazel-edge-core \
            --out-dir service-objective-so11-records

      - name: Re-validate SO-11 records
        if: always()
        run: |
          . .venv/bin/activate
          PYTHONPATH=.:py python -m azazel_edge.service_objectives validate --ci --objective SO-11 \
            --expect-commit "$GITHUB_SHA" \
            service-objective-so11-records

      - name: Upload SO-11 records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-objective-so11-records
          path: service-objective-so11-records/*.json
          if-no-files-found: error

  nexus-core-package:
    # The per-CPU Edge Core package Azazel-Nexus verifies
    # (docs/nexus-core-package.md §7). Built and packaged natively on an
    # x86_64 and an arm64 runner: the packager runs the binary (--version,
    # --health), so it does not cross-package. On each runner the package of
    # that CPU must build with the CPU read from the binary's ELF header, the
    # other CPU's name must be refused, and the packager and contract tests
    # must run with the release binary present (never skip; the test-python
    # job has no Rust build and skips them). Nothing is uploaded: a runner
    # build is not a released artifact, and which build a consumer accepts is
    # the consumer's pin.
    name: Nexus core package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            other: aarch64
            runner: ubuntu-24.04
          - arch: aarch64
            other: x86_64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rust toolchain
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Build the release core
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          cargo build --release --locked --manifest-path rust/azazel-edge-core/Cargo.toml

      - name: Packager and contract tests with the release binary
        run: |
          python -m pip install pytest
          python -m pytest -q -rs -p no:cacheprovider \
            tests/test_nexus_core_package_v1.py tests/test_nexus_contract_export.py | tee nexus-core.log
          grep -Eq "^[0-9]+ passed" nexus-core.log
          ! grep -Eq "skipped|failed|error" nexus-core.log

      - name: Package this CPU, refuse the other CPU's name
        run: |
          python packaging/nexus-core/nexus_core_package.py --architecture "${{ matrix.arch }}" --out dist/nexus-core
          python - <<'PY'
          import json, pathlib
          arch = "${{ matrix.arch }}"
          m = json.loads(pathlib.Path(f"dist/nexus-core/azazel-edge-core-0.1.0-{arch}.manifest.json").read_text())
          assert m["architecture"] == arch, m["architecture"]
          assert m["elf"]["machine"] == {"x86_64": "EM_X86_64", "aarch64": "EM_AARCH64"}[arch], m["elf"]
          assert m["artifact"] == f"azazel-edge-core-0.1.0-{arch}.tar.gz"
          PY
          if python packaging/nexus-core/nexus_core_package.py --architecture "${{ matrix.other }}" --out dist/refused; then
            echo "packaged an ${{ matrix.arch }} binary under the ${{ matrix.other }} name" >&2
            exit 1
          fi
          test ! -e dist/refused

  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  supply-chain-baseline:
    name: SBOM + dependency scan baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install supply-chain tools
        run: |
          python -m pip install -U pip
          pip install cyclonedx-bom pip-audit

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          cyclonedx-py requirements requirements/runtime.txt --output-file sbom-runtime.cdx.json

      - name: Run dependency vulnerability scan (baseline)
        continue-on-error: true
        run: |
          pip-audit -r requirements/runtime.txt -f json -o pip-audit-runtime.json

      - name: Upload supply-chain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-baseline
          path: |
            sbom-runtime.cdx.json
            pip-audit-runtime.json

      - name: Generate SHA-256 checksums for key artifacts
        run: |
          sha256sum installer/internal/install_all.sh > release-checksums.sha256
          sha256sum installer/internal/install_migrated_tools.sh >> release-checksums.sha256
          sha256sum installer/internal/install_ai_runtime.sh >> release-checksums.sha256
          sha256sum sbom-runtime.cdx.json >> release-checksums.sha256
          sha256sum pip-audit-runtime.json >> release-checksums.sha256

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: release-checksums.sha256
